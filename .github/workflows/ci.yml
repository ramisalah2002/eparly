name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript validation
        run: pnpm --filter mobile typecheck

      - name: ESLint
        run: pnpm --filter mobile lint

      - name: Unit and regression tests
        run: pnpm --filter mobile test

      - name: Expo bundle validation
        run: |
          pnpm --filter mobile exec expo export --no-bytecode --no-minify --output-dir /tmp/expo-ci-bundle
          rm -rf /tmp/expo-ci-bundle

  admin:
    name: Admin CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter admin lint

      - name: TypeScript validation
        run: pnpm --filter admin typecheck

      - name: Production build
        run: pnpm --filter admin build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure Maven Wrapper is executable
        run: chmod +x ./mvnw

      - name: Verify and test (with Testcontainers & Flyway)
        run: ./mvnw -B -ntp verify

      - name: Upload Test Reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/api/target/surefire-reports/
            services/api/target/failsafe-reports/
          retention-days: 7
