eparly.security.jwt.issuer=eparly-test
eparly.security.jwt.audience=eparly-test-client
eparly.security.jwt.access-token-ttl=PT15M
eparly.security.refresh-token.ttl=P30D
eparly.security.email-verification-ttl=PT24H
eparly.security.password-reset.ttl=PT30M
eparly.mail.from=no-reply@example.test
eparly.mail.verification-url=http://localhost/test-verify
eparly.mail.password-reset-url=http://localhost/test-reset-password
spring.mail.host=127.0.0.1
spring.mail.port=1025
management.health.mail.enabled=false
eparly.openapi.public=true

eparly.security.rate-limit.login-ip-max-attempts=1000
eparly.security.rate-limit.login-account-max-attempts=1000
eparly.security.rate-limit.register-ip-max-attempts=1000
eparly.security.rate-limit.resend-verification-ip-max-attempts=1000
eparly.security.rate-limit.resend-verification-email-max-attempts=1000
eparly.security.rate-limit.forgot-password-ip-max-attempts=1000
eparly.security.rate-limit.forgot-password-email-max-attempts=1000
eparly.security.rate-limit.reset-password-ip-max-attempts=1000
eparly.security.rate-limit.refresh-ip-max-attempts=1000
