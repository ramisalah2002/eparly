spring.application.name=api
spring.docker.compose.enabled=false

# Configuration JPA & Hibernate (validation stricte du schéma généré par Flyway)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=postgresql

# Configuration Flyway (migrations strictes, pas de baseline automatique)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Configuration Actuator (détails masqués par défaut pour la sécurité)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true

eparly.security.jwt.issuer=${JWT_ISSUER:eparly-api}
eparly.security.jwt.audience=${JWT_AUDIENCE:eparly-mobile}
eparly.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
eparly.security.refresh-token.ttl=${REFRESH_TOKEN_TTL:P30D}
eparly.security.email-verification-ttl=${EMAIL_VERIFICATION_TTL:PT24H}
eparly.security.password-reset.ttl=${PASSWORD_RESET_TTL:PT30M}
eparly.mail.password-reset-url=${PASSWORD_RESET_URL:http://localhost:8080/v1/auth/reset-password}
eparly.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
eparly.security.rate-limit.use-forwarded-for=${RATE_LIMIT_USE_FORWARDED_FOR:false}
# Connexion Google : sans Client ID configure, elle reste indisponible (503), jamais permissive.
eparly.auth.google.enabled=${GOOGLE_AUTH_ENABLED:false}
eparly.auth.google.allowed-client-ids=${GOOGLE_AUTH_ALLOWED_CLIENT_IDS:}
eparly.legal.terms-version=${TERMS_VERSION:v1}
eparly.legal.marketing-notice-version=${MARKETING_NOTICE_VERSION:v1}
eparly.openapi.public=${OPENAPI_PUBLIC:false}

# Import CSV (limites configurables)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
eparly.imports.max-file-bytes=${IMPORT_MAX_FILE_BYTES:5242880}
eparly.imports.max-rows=${IMPORT_MAX_ROWS:10000}
eparly.imports.max-columns=${IMPORT_MAX_COLUMNS:50}
eparly.imports.max-field-length=${IMPORT_MAX_FIELD_LENGTH:2000}
eparly.imports.processing-timeout=${IMPORT_PROCESSING_TIMEOUT:PT30S}
eparly.imports.preview-sample-size=${IMPORT_PREVIEW_SAMPLE_SIZE:20}
eparly.imports.max-reported-issues=${IMPORT_MAX_REPORTED_ISSUES:100}

# Collecte du catalogue désactivée tant qu'aucune source n'a été autorisée.
eparly.catalog-sync.enabled=${CATALOG_SYNC_ENABLED:false}
eparly.catalog-sync.cron=${CATALOG_SYNC_CRON:0 0 3 * * *}
eparly.catalog-sync.zone=${CATALOG_SYNC_ZONE:Europe/Paris}
eparly.catalog-sync.user-agent=${CATALOG_SYNC_USER_AGENT:EparlyCatalogBot/1.0}
eparly.catalog-sync.contact=${CATALOG_SYNC_CONTACT:}
eparly.catalog-sync.connect-timeout=${CATALOG_SYNC_CONNECT_TIMEOUT:PT3S}
eparly.catalog-sync.request-timeout=${CATALOG_SYNC_REQUEST_TIMEOUT:PT8S}
eparly.catalog-sync.max-response-bytes=${CATALOG_SYNC_MAX_RESPONSE_BYTES:2097152}
eparly.catalog-sync.max-pages-per-source=${CATALOG_SYNC_MAX_PAGES_PER_SOURCE:30}
eparly.catalog-sync.max-redirects=${CATALOG_SYNC_MAX_REDIRECTS:3}
eparly.catalog-sync.max-retries=${CATALOG_SYNC_MAX_RETRIES:2}
eparly.catalog-sync.request-delay=${CATALOG_SYNC_REQUEST_DELAY:PT1S}
eparly.catalog-sync.max-execution-duration=${CATALOG_SYNC_MAX_EXECUTION_DURATION:PT10M}
# Integration au catalogue metier (DRAFT + preuve PENDING). Coupe-circuit independant du scheduler.
eparly.catalog-sync.business-ingestion-enabled=${CATALOG_SYNC_BUSINESS_INGESTION:false}
# Rattrapage au demarrage si aucune collecte reussie depuis 24 h (poste souvent eteint a 03:00).
eparly.catalog-sync.catch-up-on-startup=${CATALOG_SYNC_CATCH_UP_ON_STARTUP:false}
eparly.catalog-sync.failure-retry-delay=${CATALOG_SYNC_FAILURE_RETRY_DELAY:PT30M}
eparly.catalog-sync.max-parallel-sources=${CATALOG_SYNC_MAX_PARALLEL_SOURCES:2}
eparly.catalog-sync.circuit-breaker-failure-threshold=${CATALOG_SYNC_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
eparly.catalog-sync.circuit-breaker-cooldown=${CATALOG_SYNC_CIRCUIT_BREAKER_COOLDOWN:P1D}
eparly.catalog-sync.max-raw-payload-bytes=${CATALOG_SYNC_MAX_RAW_PAYLOAD_BYTES:8192}
# Connecteur inactif tant qu'un compte editeur et un jeton ne sont pas fournis par l'environnement.
eparly.catalog-sync.tradedoubler.enabled=${CATALOG_SYNC_TRADEDOUBLER_ENABLED:false}
eparly.catalog-sync.tradedoubler.token=${CATALOG_SYNC_TRADEDOUBLER_TOKEN:}

# Import manuel du catalogue V1 (desactive par defaut, dry-run par defaut).
eparly.catalog-import.enabled=${CATALOG_IMPORT_ENABLED:false}
eparly.catalog-import.apply=${CATALOG_IMPORT_APPLY:false}
eparly.catalog-import.file=${CATALOG_IMPORT_FILE:}
eparly.catalog-import.actor-user-id=${CATALOG_IMPORT_ACTOR_USER_ID:}
