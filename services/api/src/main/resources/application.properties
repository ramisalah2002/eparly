spring.application.name=api

# Configuration JPA & Hibernate (validation stricte du schéma généré par Flyway)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=postgresql

# Configuration Flyway (migrations strictes, pas de baseline automatique)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Configuration Actuator (détails masqués par défaut pour la sécurité)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
