# ==============================================================================
# Profil LOCAL : Développement avec intégration Docker Compose
# ==============================================================================

# Chargement optionnel des variables d'environnement locales (non commité)
spring.config.import=optional:file:../../infra/.env[.properties]

# Intégration Spring Boot Docker Compose
spring.docker.compose.enabled=true
spring.docker.compose.file=../../infra/compose.yml
spring.docker.compose.profiles.active=local
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.readiness.wait=always
spring.docker.compose.readiness.timeout=30s

# Configuration DataSource (valeurs de repli paramétrables par variables d'environnement)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eparly_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:eparly_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.pool-name=EparlyHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Clés RSA de développement locales, à générer sous infra/keys (ignoré par Git).
eparly.security.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:file:../../infra/keys/jwt-public.pem}
eparly.security.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:file:../../infra/keys/jwt-private.pem}

# SMTP local : Mailpit, sans authentification.
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
eparly.mail.from=${MAIL_FROM:no-reply@eparly.local}
eparly.mail.verification-url=${EMAIL_VERIFICATION_URL:mobile://(auth)/otp-verification}
eparly.mail.password-reset-url=${PASSWORD_RESET_URL:http://localhost:8080/v1/auth/reset-password}
eparly.openapi.public=true

# Actuator en local : affichage des détails pour le diagnostic des développeurs
management.endpoint.health.show-details=always
