# Les paramètres requis empêchent un démarrage de production avec des clés ou TLS absents.
eparly.security.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION}
eparly.security.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION}

server.ssl.enabled=true
server.ssl.key-store=${TLS_KEY_STORE_LOCATION}
server.ssl.key-store-password=${TLS_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
eparly.mail.from=${MAIL_FROM}
eparly.mail.verification-url=${EMAIL_VERIFICATION_URL}
eparly.mail.password-reset-url=${PASSWORD_RESET_URL}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
