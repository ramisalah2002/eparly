# Changelog maître Liquibase.
#
# Les scripts V1 à V21 sont les anciennes migrations Flyway, reprises sans modification.
# Une base déjà migrée par Flyway n'est pas rejouée : chaque changeset est marqué « MARK_RAN »
# si sa version figure comme réussie dans flyway_schema_history.
#
# Règle : ne jamais modifier un changeset déjà appliqué ; ajouter un nouveau fichier à la suite.
databaseChangeLog:
  - changeSet:
      id: V1__init_schema
      author: eparly
      preConditions:
        - onFail: MARK_RAN
        - or:
            - not:
                - tableExists:
                    tableName: flyway_schema_history
            - sqlCheck:
                expectedResult: 0
                sql: SELECT COUNT(*) FROM flyway_schema_history WHERE version = '1' AND success
      changes:
        - sqlFile:
            path: sql/V1__init_schema.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
